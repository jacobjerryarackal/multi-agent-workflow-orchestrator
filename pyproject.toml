[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-workflow-orchestrator"
version = "0.1.0"
description = "Production-oriented multi-agent workflow orchestration engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Orchestrator Team" }]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["backend", "tests"]
extraPaths = ["backend"]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"

